services:
  db:
    image: postgres:16-alpine
    container_name: afuegolento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: afuegolento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  backend:
    build:
      context: ./backend
    container_name: afuegolento-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/afuegolento
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: afuegolento-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - '8081:8081'
      - '19000:19000'
      - '19001:19001'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
